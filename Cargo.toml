[workspace]
resolver = "3"
members = [".", "migration"]

[package]
name = "cardboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-valid = { version = "0.25.0", default-features = false, features = [
    "garde",
    "basic",
] }
chrono = "0.4.45"
dotenvy = "0.15.7"
garde = { version = "0.23.0", features = ["derive"] }
hex = "0.4.3"
migration = { version = "0.1.0", path = "migration" }
rand = "0.10.2"
sea-orm = { version = "2.0.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-ipnetwork",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.26.0", features = ["v4"] }
